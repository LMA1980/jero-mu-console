[package]
name = "unyeong"
version = "0.1.0"
edition = "2024"
default-run = "unyeong"

[dependencies]
anyhow = "1.0.102"
async-trait = "*"
clap = { version = "4.6.0", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1.52.0", features = ["full"] }
tokio-stream = "0.1.18"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.15.1", features = ["v4"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
mockall = "0.12"
tempfile = "3.10"

[[bench]]
name = "unyeong_bench"
harness = false
